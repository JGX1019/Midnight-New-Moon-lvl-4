name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci installs exactly what's in package-lock.json and fails loudly
      # if package.json and the lockfile have drifted apart, instead of
      # silently re-resolving semver ranges to newer versions the way
      # `npm install` can. That drift previously caused compact-runtime to
      # resolve to a newer, API-incompatible version in CI while the local
      # node_modules stayed on the older one.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Compact compiler
        run: |
          curl -fsSL https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh -o /tmp/compact-installer.sh
          bash /tmp/compact-installer.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Not optional: the installer script only fetches the CLI wrapper, not the
      # toolchain binary itself. Without `compact update`, every subsequent
      # `compact compile` fails with "No default compiler set".
      #
      # PINNED to 0.31.1 deliberately. A bare `compact update` fetches the
      # LATEST toolchain, and newer toolchains generate contract bindings
      # whose initialState()/circuit calls are async (return Promises). The
      # committed managed/ output and the tests are written against the
      # 0.31.1 sync shape, so an unpinned toolchain regenerates async
      # bindings in CI and every test file fails to typecheck with
      # "Property does not exist on type Promise<...>. Did you forget to use
      # 'await'?". Keep this matched to the local toolchain version.
      - name: Download Compact toolchain
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1

      - name: Verify Compact version
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact --version

      - name: Compile review contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact compile contracts/review.compact managed/review

      - name: Compile survey contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact compile contracts/survey.compact managed/survey

      - name: Compile counter contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact compile contracts/counter.compact managed/counter

      - name: Run test suite
        run: node --experimental-vm-modules node_modules/.bin/jest --testPathPattern=tests/ --forceExit

      - name: Build frontend
        run: npm run build
